<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Runtime event handler injection via SMIL -->
  <!-- Sanitizer sees no onclick attribute at parse time -->
  <!-- SMIL writes it at t=0 -->
  <g id="target">
    <rect x="10" y="10" width="200" height="60" fill="blue" rx="6"/>
    <text x="110" y="46" text-anchor="middle" fill="white">Click me</text>
    <set attributeName="onclick" begin="0s" to="alert(document.domain)" fill="freeze"/>
    <set attributeName="onmouseover" begin="0s" to="this.style.fill='red'" fill="freeze"/>
  </g>
  <!-- Also test: animate writing tabindex + focus-triggered handler -->
  <g id="target2">
    <rect x="10" y="90" width="250" height="50" fill="green" rx="6"/>
    <text x="135" y="121" text-anchor="middle" fill="white">onactivate test</text>
    <set attributeName="onactivate" begin="0s" to="alert('activated')" fill="freeze"/>
  </g>
</svg>
