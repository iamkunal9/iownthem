<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="100" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <a id="lnktarget"><text x="10" y="50">Target link</text></a>
  <animate xlink:href="#lnktarget" attributeName="href" values="https://example.com" begin="0s" dur="0.1s" fill="freeze"/>
</svg>
