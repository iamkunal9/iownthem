<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Test exact rewrite behavior for different URL forms -->
  <image id="i1" href="https://evil.com" x="0" y="0" width="50" height="50"/>
  <image id="i2" href="https://evil.com/" x="60" y="0" width="50" height="50"/>
  <image id="i3" href="//evil.com/img.png" x="120" y="0" width="50" height="50"/>
  <image id="i4" href="/local/path/img.png" x="180" y="0" width="50" height="50"/>
  <image id="i5" href="https://evil.com/a/b/c.png" x="240" y="0" width="50" height="50"/>
</svg>
