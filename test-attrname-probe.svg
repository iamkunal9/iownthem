<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect id="r1" x="10" y="10" width="50" height="50" fill="blue">
    <animate attributeName="fill" from="blue" to="red" dur="2s" fill="freeze"/>
  </rect>
  <rect id="r2" x="70" y="10" width="50" height="50">
    <animate attributeName="class" from="" to="link-style" dur="0.1s" fill="freeze"/>
  </rect>
  <a id="lnk3">
    <rect x="130" y="10" width="50" height="50" fill="green"/>
    <animate attributeName="tabindex" from="0" to="0" dur="0.1s" fill="freeze"/>
  </a>
  <rect id="r4" x="190" y="10" width="50" height="50" fill="purple">
    <animate attributeName="display" from="none" to="inline" dur="0.1s" fill="freeze"/>
  </rect>
</svg>
