<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="150" xmlns="http://www.w3.org/2000/svg">
  <a id="navtarget"><text x="10" y="50">Click me</text></a>
  <!-- SVG 2.0: href on animate (not xlink:href) for element targeting -->
  <animate href="#navtarget" attributeName="href" values="https://theexploit.store" begin="0s" dur="0.1s" fill="freeze"/>
</svg>
